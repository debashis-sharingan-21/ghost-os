[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ghost-os"
version = "1.0.0"
description = "GHOST.OS — The Machine Remembers: Real-Time ESP32 Telemetry, Anomaly Detection & Forensic AI"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.32.0",
    "pydantic>=2.9.0",
    "pyserial>=3.5",
    "httpx>=0.27.0",
    "websockets>=13.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_default_fixture_loop_scope = "function"
