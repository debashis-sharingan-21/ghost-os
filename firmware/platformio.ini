; GHOST.OS — ESP32-WROOM-32 Telemetry Firmware
; Target: ESP32-DevKitC / ESP32-WROOM-32
; Platform: espressif32
; Framework: Arduino

[env:esp32dev]
platform = espressif32@^6.9.0
board = esp32dev
framework = arduino

monitor_speed = 115200
upload_speed = 460800
monitor_filters = direct, colorize

; Library dependencies for I2C and MPU6050
lib_deps =
    electroniccats/MPU6050@^1.3.1
    bblanchon/ArduinoJson@^7.2.0

build_flags =
    -O2
    -Wall
    -DCORE_DEBUG_LEVEL=1
    -DSERIAL_BAUD=115200
    -DSAMPLE_HZ=10
